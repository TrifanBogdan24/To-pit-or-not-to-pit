name: Run Checker Tests on C-Method-1

on:
  push:
    branches: main
    paths: ['tests_data/**', '.github/workflows/**', 'C-method-1/**']
  pull_request:
    branches: main
    paths: ['tests_data/**', '.github/workflows/**', 'C-method-1/**']



jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Install dependencies (Python3 & Valgrind)
        run: |
          sudo apt update
          sudo apt install -y python3 valgrind

      - name: Run implementation tests & memory check with Valgrind
        working-directory: ./C-method-1/tests
        run: python3 checker.py --all --valgrind --output 2>&1 | tee test_results.txt
      
      - name: Coding Style checker
        # directory not specified => running from repo's root
        run: |
          chmod +x ./C-coding-style/checkpatch.pl ./C-coding-style/cs.sh
          ./C-coding-style/cs.sh C-method-1/src 2>&1 | tee ./C-method-1/tests/coding_style.txt

      - name: Upload test logs as artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checker-logs
          path: |
            C-method-1/tests/test_results.txt
            C-method-1/tests/coding_style.txt
            # Without `*` globbing, folders files will not be uploaded
            tests_data/output-C-method-1/*
            tests_data/valgrind_logs-C-method-1/*
          retention-days: 5
